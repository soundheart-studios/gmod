# Copy to .gitea/workflows/gmod.yml. For a runner on the Gitea host itself
# (gitea-runner in host mode, label "ai-local"), with the gmod tool installed
# at $GMOD_HOME and a model behind an OpenAI-compatible endpoint.
#
# In branch protection for main: require pull requests and the "gate" check.
# The review only comments (GMOD_REVIEW_MODE: comment); require it too once
# you trust it, and drop that line.
name: gmod
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

env:
  GMOD_HOME: /home/acme/gait-pilot/gmod-tool
  GMOD_REVIEW_URL: http://127.0.0.1:8080/v1
  GMOD_REVIEW_MODE: comment

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ai-local
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The deterministic gate
        run: |
          git fetch -q origin '+refs/gmod/claims/*:refs/gmod/claims/*' || true
          node "$GMOD_HOME/bin/gmod.mjs" verify --base "origin/$BASE" --head HEAD --branch "$BRANCH" --title "$TITLE" --report gate.md
        env:
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
      - name: Post it on the pull request
        if: always()
        run: node "$GMOD_HOME/ci/comment.mjs" --marker gmod-gate --file gate.md
        env:
          GMOD_PR: ${{ github.event.pull_request.number }}
          GMOD_TOKEN: ${{ github.token }}

  review:
    needs: gate
    if: github.event_name == 'pull_request'
    runs-on: ai-local
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The AI review (advice only)
        run: node "$GMOD_HOME/ci/review.mjs" --base "origin/$BASE" --head HEAD --branch "$BRANCH" --title "$TITLE" --report review.md
        env:
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
      - name: Post it on the pull request
        if: always()
        run: node "$GMOD_HOME/ci/comment.mjs" --marker gmod-review --file review.md
        env:
          GMOD_PR: ${{ github.event.pull_request.number }}
          GMOD_TOKEN: ${{ github.token }}

  sweep:
    if: github.event_name == 'push'
    runs-on: ai-local
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Let go of claims on finished jobs
        run: node "$GMOD_HOME/bin/gmod.mjs" sweep
