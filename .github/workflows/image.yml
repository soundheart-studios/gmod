# The gmod-runner image. Every push builds it and checks it runs; a v* tag
# publishes ghcr.io/soundheart-studios/gmod-runner:<version>.
name: image
on:
  push:
    branches: [main, next]
    tags: ['v*']
  pull_request:
jobs:
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env:
      IMAGE: ghcr.io/soundheart-studios/gmod-runner
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - name: Build
        run: docker build --build-arg GMOD_COMMIT=${GITHUB_SHA::7} -t gmod-runner:test .
      - name: It runs
        run: |
          docker run --rm gmod-runner:test gmod version
          docker run --rm gmod-runner:test sh -c 'node --version && uv --version && uv python find 3.12 && git --version'
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag gmod-runner:test "$IMAGE:${GITHUB_REF_NAME#v}"
          docker push "$IMAGE:${GITHUB_REF_NAME#v}"
